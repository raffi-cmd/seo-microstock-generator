 <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1120" />
<title>SEO Microstock Metadata Generator</title>
<style>
  :root{
    --bg:#0b1120; --bg-grad:#1e293b; --card:#111827; --card-2:#0f172a;
    --border:#334155; --border-2:#1e293b; --text:#e5e7eb; --muted:#94a3b8;
    --accent:#22c55e; --accent-dark:#16a34a; --accent-soft:rgba(34,197,94,.12);
    --danger:#f87171; --info:#38bdf8; --radius:14px; --radius-sm:10px;
    --shadow:0 20px 50px rgba(0,0,0,.35); --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, var(--bg-grad), var(--bg));
    color:var(--text); min-height:100vh; padding:16px; margin:0;
    -webkit-font-smoothing:antialiased;
  }
  .container{max-width:1120px;margin:0 auto}
  .app-header{text-align:center;margin-bottom:20px}
  .app-header h1{
    margin:0 0 6px; font-size:clamp(20px, 5vw, 32px); letter-spacing:-.03em;
    background:linear-gradient(90deg,#a7f3d0,#22c55e 60%,#4ade80);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .app-header p{margin:0;color:var(--muted);font-size:clamp(13px, 2.4vw, 14px)}
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:860px){.grid{grid-template-columns:1fr 1.2fr;gap:20px}}
  
  .card{
    background:linear-gradient(180deg, rgba(17,24,39,.95), rgba(15,23,42,.92));
    border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); backdrop-filter:blur(12px);
  }
  .card h2{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent)}

  .field{display:block;margin-bottom:12px}
  .field-label{display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase}
  .input-wrap{position:relative; display:flex; gap:8px;}
  
  input[type=password],input[type=text], select{
    width:100%; padding:12px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:#020617; color:var(--text); font-size:14px; outline:none; min-height:var(--tap);
    appearance: none; -webkit-appearance: none;
  }
  select {
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat; background-position: right 12px top 50%; background-size: 12px auto;
  }
  input:focus, select:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  
  .toggle-eye{
    position:absolute; top:50%; right:6px; transform:translateY(-50%);
    background:transparent; border:0; padding:8px; cursor:pointer; color:var(--muted); font-size:16px;
  }

  .upload-box{
    display:block; border:2px dashed var(--border); border-radius:var(--radius);
    padding:20px; text-align:center; cursor:pointer; background:rgba(15,23,42,.55); transition:.2s;
  }
  .upload-box:hover, .upload-box.dragover{border-color:var(--accent); background:var(--accent-soft);}
  .upload-box input{display:none}
  .upload-icon{font-size:32px;margin-bottom:6px;display:block}
  .upload-box strong{display:block;font-size:14.5px}
  .upload-box span{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}

  #preview{margin-top:12px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);display:none}
  #preview img,#preview video{width:100%;max-height:240px;display:block;object-fit:contain;background:#020617}
  
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .actions .full{grid-column:1 / -1}
  @media (min-width:480px){.actions{grid-template-columns:1.4fr 1fr 1fr}.actions .full{grid-column:auto}}
  
  button{
    border:none; border-radius:var(--radius-sm); padding:12px 14px; font-weight:700;
    cursor:pointer; transition:.15s; min-height:var(--tap); display:flex;
    align-items:center; justify-content:center; gap:8px; font-size:14px;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:linear-gradient(180deg,#22c55e,#16a34a); color:#052e16}
  .btn-primary:not(:disabled):hover{background:linear-gradient(180deg,#16a34a,#15803d); color:#fff}
  .btn-secondary{background:#1e293b; color:var(--text); border:1px solid var(--border)}
  .btn-secondary:hover{background:#273449}

  #status{margin-top:12px;font-size:13px;min-height:20px;padding:0 2px}
  #status.error{color:var(--danger)} #status.success{color:var(--accent)}
  
  .result-group {
    background: #020617; border: 1px solid var(--border);
    border-radius: var(--radius-sm); margin-bottom: 12px; overflow: hidden;
  }
  .result-header {
    display: flex; justify-content: space-between; align-items: center;
    background: #0f172a; padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  .result-header span { font-size: 12px; font-weight: 700; color: var(--accent); }
  .btn-copy-small {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 4px 10px; font-size: 11px; border-radius: 6px; min-height: 28px; cursor: pointer;
  }
  .btn-copy-small:hover { background: var(--border); color: #fff; }
  .result-group textarea, .result-group input {
    width: 100%; border: none; background: transparent; color: var(--text);
    padding: 12px; font-size: 13.5px; outline: none; resize: vertical; font-family: inherit;
  }
  .result-group textarea { min-height: 80px; }
  
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#0f172a; border:1px solid var(--border); color:var(--text);
    padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:.25s; z-index:999;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="container">
  <header class="app-header">
    <h1>SEO Microstock Generator</h1>
    <p>Pilih provider & model, lalu copy-paste hasilnya ke Adobe Stock.</p>
  </header>

  <div class="grid">
    <!-- PANEL KIRI -->
    <section class="card">
      <h2>1. API & Media</h2>

      <div class="field">
        <label class="field-label" for="apiKeyInput">API Key</label>
        <div class="input-wrap">
          <input id="apiKeyInput" type="password" placeholder="Tempel API Key di sini (AIza..., sk-...)" autocomplete="off" />
          <button class="toggle-eye" id="toggleEye" type="button">👁</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="providerSelect">Provider AI</label>
        <select id="providerSelect">
          <option value="auto">Deteksi Otomatis (Berdasarkan Key)</option>
          <option value="gemini">Google Gemini</option>
          <option value="openai">OpenAI (ChatGPT)</option>
          <option value="anthropic">Anthropic (Claude)</option>
          <option value="groq">Groq</option>
          <option value="openrouter">OpenRouter</option>
          <option value="xai">xAI (Grok)</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="modelSelect">Model AI</label>
        <select id="modelSelect">
          <option value="">-- Ketik API Key Dulu --</option>
        </select>
        <input id="customModelInput" type="text" placeholder="Ketik nama model manual (cth: gemini-1.5-pro)" style="display:none; margin-top:8px;" />
      </div>

      <label class="upload-box" for="fileInput" id="dropZone">
        <span class="upload-icon">📤</span>
        <strong>Pilih foto / video</strong>
        <span>Format: JPG, PNG, MP4, WEBM</span>
        <input id="fileInput" type="file" accept="image/*,video/*" />
      </label>

      <div id="preview"></div>

      <div class="actions">
        <button id="generateBtn" class="btn-primary full" disabled>Generate Metadata</button>
        <button id="clearBtn" class="btn-secondary">Reset</button>
      </div>

      <div id="status" aria-live="polite"></div>
    </section>

    <!-- PANEL KANAN -->
    <section class="card">
      <h2>2. Hasil Metadata</h2>
      
      <div class="result-group">
        <div class="result-header">
          <span>Title</span>
          <button class="btn-copy-small" onclick="copyField('outTitle')">Copy</button>
        </div>
        <textarea id="outTitle" readonly placeholder="Judul akan muncul di sini..."></textarea>
      </div>

      <div class="result-group">
        <div class="result-header">
          <span>Description</span>
          <button class="btn-copy-small" onclick="copyField('outDesc')">Copy</button>
        </div>
        <textarea id="outDesc" readonly placeholder="Deskripsi akan muncul di sini..."></textarea>
      </div>

      <div class="result-group">
        <div class="result-header">
          <span>Keywords (Dipisah Koma)</span>
          <button class="btn-copy-small" onclick="copyField('outKeywords')">Copy</button>
        </div>
        <textarea id="outKeywords" readonly placeholder="Kata kunci akan muncul di sini..."></textarea>
      </div>

      <div class="result-group">
        <div class="result-header">
          <span>Kategori Adobe Stock</span>
          <button class="btn-copy-small" onclick="copyField('outCategory')">Copy</button>
        </div>
        <input id="outCategory" type="text" readonly placeholder="Kategori akan muncul di sini..." />
      </div>
    </section>
  </div>
</div>

<div class="toast" id="toast">Disalin!</div>

<script>
const PROMPT = `You are a senior SEO expert for Adobe Stock, Shutterstock, and Freepik.
Analyze the attached media and respond EXACTLY in this format with NO extra text, NO markdown, NO bullet points:

Title:
[Descriptive English title. Max 70-80 chars. No subjective words like beautiful/amazing.]

Description:
[1-2 sentences describing object, background, mood, colors, context.]

Keywords:
[30-40 relevant English keywords separated ONLY by commas. No numbering.]

Category:
[Exactly one Adobe Stock category, e.g. Technology, People, Nature, Business, etc.]`;

const $ = (id) => document.getElementById(id);
const apiKeyInput = $("apiKeyInput");
const providerSelect = $("providerSelect");
const modelSelect = $("modelSelect");
const customModelInput = $("customModelInput");
const fileInput = $("fileInput");
const preview = $("preview");
const generateBtn = $("generateBtn");
const clearBtn = $("clearBtn");
const statusEl = $("status");
const dropZone = $("dropZone");
const toastEl = $("toast");

let selectedFile = null;

// Daftar Model Default per Provider
const MODELS = {
  gemini: ["gemini-1.5-flash", "gemini-1.5-pro", "gemini-2.0-flash-exp", "gemini-1.0-pro-vision-latest"],
  openai: ["gpt-4o-mini", "gpt-4o", "gpt-4-turbo"],
  anthropic: ["claude-3-5-sonnet-20240620", "claude-3-haiku-20240307"],
  groq: ["llama-3.2-11b-vision-preview", "llama-3.2-90b-vision-preview"],
  openrouter: ["anthropic/claude-3.5-sonnet", "google/gemini-pro-1.5", "openai/gpt-4o"],
  xai: ["grok-2-vision-1212", "grok-vision-beta"]
};

// Bersihkan Key dan Deteksi
function cleanKey(key) {
  return (key || "").replace(/['"]+/g, '').trim(); // Hapus kutip dan spasi
}

function autoDetectProvider(key) {
  const k = cleanKey(key);
  if (k.startsWith("sk-or-v1-")) return "openrouter";
  if (k.startsWith("sk-ant-"))   return "anthropic";
  if (k.startsWith("gsk_"))      return "groq";
  if (k.startsWith("AIza") || k.startsWith("AQ.Ab")) return "gemini";
  if (k.startsWith("sk-"))       return "openai";
  if (k.startsWith("xai-"))      return "xai";
  return "gemini"; // Fallback ke Gemini kalau tidak dikenali
}

// Update Dropdown Model
function updateModelDropdown(providerId) {
  modelSelect.innerHTML = "";
  const models = MODELS[providerId] || [];
  
  if (models.length === 0) {
    modelSelect.innerHTML = '<option value="">-- Tidak ada model default --</option>';
  } else {
    models.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m; opt.textContent = m;
      modelSelect.appendChild(opt);
    });
  }
  
  // Tambahkan opsi manual
  const optCustom = document.createElement("option");
  optCustom.value = "custom"; optCustom.textContent = "✏️ Ketik Manual (Custom)...";
  modelSelect.appendChild(optCustom);
}

// Event Listener saat API Key diketik
apiKeyInput.addEventListener("input", () => {
  const key = cleanKey(apiKeyInput.value);
  if (!key) return;

  // Kalau user pilih "auto", kita deteksi
  if (providerSelect.value === "auto") {
    const detected = autoDetectProvider(key);
    updateModelDropdown(detected);
  }
});

// Event Listener saat Provider diubah manual
providerSelect.addEventListener("change", () => {
  let p = providerSelect.value;
  if (p === "auto") {
    p = autoDetectProvider(apiKeyInput.value);
  }
  updateModelDropdown(p);
});

// Event Listener saat Model diubah (munculkan input manual jika pilih 'custom')
modelSelect.addEventListener("change", () => {
  if (modelSelect.value === "custom") {
    customModelInput.style.display = "block";
    customModelInput.focus();
  } else {
    customModelInput.style.display = "none";
    customModelInput.value = "";
  }
});

// Inisialisasi awal
updateModelDropdown("gemini");

// Toggle Eye
$("toggleEye").addEventListener("click", () => {
  const isPass = apiKeyInput.type === "password";
  apiKeyInput.type = isPass ? "text" : "password";
  $("toggleEye").textContent = isPass ? "🙈" : "👁";
});

// Handle File
dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", (e) => { e.preventDefault(); dropZone.classList.remove("dragover"); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener("change", (e) => { if(e.target.files[0]) handleFile(e.target.files[0]); });

function handleFile(file) {
  selectedFile = file;
  preview.innerHTML = ""; preview.style.display = "block";
  if (file.type.startsWith("image/")) {
    const img = document.createElement("img"); img.src = URL.createObjectURL(file); preview.appendChild(img);
  } else if (file.type.startsWith("video/")) {
    const v = document.createElement("video"); v.src = URL.createObjectURL(file); v.controls = true; v.muted = true; preview.appendChild(v);
  }
  generateBtn.disabled = false;
  setStatus("");
}

clearBtn.addEventListener("click", () => {
  selectedFile = null; fileInput.value = ""; preview.innerHTML = ""; preview.style.display = "none";
  generateBtn.disabled = true; setStatus("");
  ["outTitle","outDesc","outKeywords","outCategory"].forEach(id => $(id).value = "");
});

window.copyField = function(id) {
  const el = $(id);
  if(!el.value) return;
  navigator.clipboard.writeText(el.value).then(() => showToast("Berhasil disalin!"));
};

function showToast(msg) {
  toastEl.textContent = msg; toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2000);
}
function setStatus(msg, type="") { statusEl.textContent = msg; statusEl.className = type; }

// GENERATE
generateBtn.addEventListener("click", async () => {
  const apiKey = cleanKey(apiKeyInput.value);
  let providerId = providerSelect.value;
  
  if (providerId === "auto") providerId = autoDetectProvider(apiKey);
  
  let finalModel = modelSelect.value;
  if (finalModel === "custom") finalModel = customModelInput.value.trim();
  if (!finalModel) finalModel = MODELS[providerId]?.[0] || "gemini-1.5-flash";

  if (!selectedFile) return setStatus("Pilih file dulu.", "error");
  if (!apiKey) return setStatus("API key kosong.", "error");

  generateBtn.disabled = true;
  generateBtn.innerHTML = '<span style="width:16px;height:16px;border:2px solid #052e16;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;display:inline-block"></span> Memproses...';
  setStatus(`Menganalisis via ${providerId.toUpperCase()} (${finalModel})...`);

  try {
    const text = await analyzeMedia(providerId, finalModel, apiKey, selectedFile);
    parseAndPopulate(text);
    setStatus("Selesai! Metadata berhasil dibuat.", "success");
  } catch (err) {
    console.error(err);
    setStatus("Gagal: " + err.message, "error");
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = "Generate Metadata";
  }
});

function parseAndPopulate(text) {
  const titleMatch = text.match(/Title:\s*([\s\S]*?)(?=\nDescription:|$)/i);
  const descMatch  = text.match(/Description:\s*([\s\S]*?)(?=\nKeywords:|$)/i);
  const kwMatch    = text.match(/Keywords:\s*([\s\S]*?)(?=\nCategory:|$)/i);
  const catMatch   = text.match(/Category:\s*([\s\S]*?)$/i);

  $("outTitle").value = titleMatch ? titleMatch[1].trim() : "";
  $("outDesc").value = descMatch ? descMatch[1].trim() : "";
  
  if (kwMatch) {
    let kw = kwMatch[1].replace(/\n/g, ', ').replace(/,\s*,/g, ',').trim();
    $("outKeywords").value = kw;
  } else { $("outKeywords").value = ""; }

  $("outCategory").value = catMatch ? catMatch[1].trim().replace(/[\[\]]/g, '') : "";
}

// API CALLS
async function analyzeMedia(providerId, model, apiKey, file) {
  if (providerId === "gemini") return callGemini(model, apiKey, file);
  if (["openai","groq","openrouter","xai"].includes(providerId)) return callOpenAICompatible(providerId, model, apiKey, file);
  if (providerId === "anthropic") return callAnthropic(model, apiKey, file);
  throw new Error("Provider tidak didukung");
}

async function callGemini(model, apiKey, file) {
  let parts;
  if (file.type.startsWith("video/")) {
    setStatus("Upload video ke Google...");
    const up = await uploadGeminiVideo(apiKey, file);
    parts = [{ file_data: { file_uri: up.uri, mime_type: up.mimeType } }, { text: PROMPT }];
  } else {
    const b64 = await fileToBase64(file);
    parts = [{ inline_data: { mime_type: file.type, data: b64 } }, { text: PROMPT }];
  }
  
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contents: [{ parts }], generationConfig: { temperature: 0.6, maxOutputTokens: 1024 } })
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error?.message || "Gagal memanggil Gemini. Pastikan API Key benar.");
  }
  return (await res.json()).candidates[0].content.parts.map(p => p.text).join("");
}

async function callOpenAICompatible(providerId, model, apiKey, file) {
  const baseURL = { openai: "https://api.openai.com/v1", groq: "https://api.groq.com/openai/v1", openrouter: "https://openrouter.ai/api/v1", xai: "https://api.x.ai/v1" }[providerId];
  let imageDataUrl = file.type.startsWith("video/") ? await extractFirstFrame(file) : await dataURL(file);
  
  const res = await fetch(`${baseURL}/chat/completions`, {
    method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
    body: JSON.stringify({
      model: model, max_tokens: 1024, temperature: 0.6,
      messages: [{ role: "user", content: [{ type: "image_url", image_url: { url: imageDataUrl } }, { type: "text", text: PROMPT }] }]
    })
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error?.message || "Gagal memanggil API");
  }
  return (await res.json()).choices[0].message.content;
}

async function callAnthropic(model, apiKey, file) {
  let imageDataUrl = file.type.startsWith("video/") ? await extractFirstFrame(file) : await dataURL(file);
  const b64 = imageDataUrl.split(",")[1], mime = imageDataUrl.split(";")[0].split(":")[1];
  
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01" },
    body: JSON.stringify({
      model: model, max_tokens: 1024,
      messages: [{ role: "user", content: [{ type: "image", source: { type: "base64", media_type: mime, data: b64 } }, { type: "text", text: PROMPT }] }]
    })
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error?.message || "Gagal memanggil Anthropic");
  }
  return (await res.json()).content[0].text;
}

// Helpers
function fileToBase64(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(f); }); }
function dataURL(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }

function extractFirstFrame(file) {
  return new Promise((resolve, reject) => {
    const v = document.createElement("video"); v.src = URL.createObjectURL(file); v.muted = true; v.playsInline = true;
    v.addEventListener("loadeddata", () => { v.currentTime = 0.1; });
    v.addEventListener("seeked", () => {
      const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
      URL.revokeObjectURL(v.src); resolve(c.toDataURL("image/jpeg", 0.9));
    });
    v.addEventListener("error", () => reject(new Error("Gagal baca video")));
  });
}

async function uploadGeminiVideo(apiKey, file) {
  const start = await fetch(`https://generativelanguage.googleapis.com/upload/v1beta/files?key=${apiKey}`, {
    method: "POST", headers: { "X-Goog-Upload-Protocol": "resumable", "X-Goog-Upload-Command": "start", "X-Goog-Upload-Header-Content-Length": file.size, "X-Goog-Upload-Header-Content-Type": file.type, "Content-Type": "application/json" },
    body: JSON.stringify({ file: { display_name: file.name } })
  });
  const url = start.headers.get("X-Goog-Upload-URL");
  const up = await fetch(url, { method: "POST", headers: { "X-Goog-Upload-Command": "upload, finalize", "X-Goog-Upload-Offset": "0", "Content-Length": file.size }, body: file });
  let f = (await up.json()).file;
  while (f.state === "PROCESSING") { await new Promise(r => setTimeout(r, 2000)); f = await (await fetch(`https://generativelanguage.googleapis.com/v1beta/${f.name}?key=${apiKey}`)).json(); }
  return { uri: f.uri, mimeType: f.mimeType };
}

const style = document.createElement('style');
style.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
document.head.appendChild(style);
